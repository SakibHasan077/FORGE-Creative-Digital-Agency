<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORGE-Industrial Coworking Space </title>
  <!-- Css -->
  <link rel="stylesheet" href="./style.css">
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header>
    <nav class="flex justify-between items-center bg-[#0f0f0f] text-white px-8 py-4">
      <!-- Logo -->
      <div  class="hover:translate-y-[-2px] transition-all">
        <a href="./index.html" class="group w-[150px] flex items-center">
          <svg class="w-[35px] h-[35px] transition-colors duration-200" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 10 L5 30 L15 30 L15 20 L25 20 L25 30 L35 30 L35 10 L25 10 L25 15 L15 15 L15 10 Z"
                  fill="#E63946"
                  class="group-hover:fill-[#FF6B35] transition-colors duration-200"></path>

            <rect x="18" y="5" width="4" height="30"
                  fill="#FF6B35" opacity="0.8"
                  class="group-hover:fill-[#FF6B35] transition-colors duration-200"></rect>

            <rect x="5" y="18" width="30" height="4"
                  fill="#FF6B35" opacity="0.8"
                  class="group-hover:fill-[#FF6B35] transition-colors duration-200"></rect>
          </svg>

          <span class="text-[#e22f47] text-[28px] font-extrabold ps-2 group-hover:text-[#FF6B35] transition-colors duration-200">
            FORGE
          </span>
        </a>
      </div>
      <!-- Navigation Links -->
      <ul class="hidden md:flex">
        <li><a class="text-[17px] transition-all uppercase font-[500] py-[12px] px-[14px] lg:px-[24px] hover:bg-[#E63946] " href="#">Spaces</a></li>
        <li><a class="text-[17px] transition-all uppercase font-[500] py-[12px] px-[14px] lg:px-[24px] hover:bg-[#E63946] " href="#">Pricing</a></li>
        <li><a class="text-[17px] transition-all uppercase font-[500] py-[12px] px-[14px] lg:px-[24px] hover:bg-[#E63946] " href="#">Amenities</a></li>
        <li><a class="text-[17px] transition-all uppercase font-[500] py-[12px] px-[14px] lg:px-[24px] hover:bg-[#E63946] " href="#">Contact</a></li>
      </ul>
      <!-- Button -->
      <button class="text-[#e22f47] px-8 py-3 border  border-[#e22f47] hover:bg-[#e22f47] hover:text-white text-[16px] font-[600] uppercase transition hidden md:block">Book Tour</button>
      <!-- Toggle bar -->
      <div class="menu-toggle-bar flex flex-col gap-[6px] cursor-pointer md:hidden">
        <span class="h-[2px] w-[25px] bg-white transition"></span>
        <span class="h-[2px] w-[25px] bg-white transition"></span>
        <span class="h-[2px] w-[25px] bg-white transition"></span>
      </div>
    </nav>
    <!-- Header Section -->
    <section class="header h-[calc(100vh-82px)] bg-no-repeat bg-cover bg-center">
      <h1>
        Where Ideas <br>
        <span>Forge Reality</span>
      </h1>
      <p>Industrial coworking spaces designed for creators, innovators, and disruptors.</p>
      <div>
        <button>
          Start Free Trial
        </button>
        <button>Virtual Tour</button>
      </div>
    </section>
  </header>

</body>
</html>
